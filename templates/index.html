<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Recarga Sala FF 🔥</title>
<style>
body {
    background: url('https://share.google/cG3BrTRr9BBOkoS0n') no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
}
.container {
    margin-top: 50px;
    padding: 20px;
    background: rgba(0,0,0,0.6);
    display: inline-block;
    border-radius: 10px;
}
select, input { padding: 10px; margin: 10px; }
button { padding: 10px 20px; margin: 10px; cursor: pointer; }
.adm { position: absolute; top: 10px; right: 10px; }
</style>
</head>
<body>
<a class="adm" href="{{ url_for('admin_login') }}">ADM</a>
<div class="container">
<h1>Recarga Sala FF 🔥</h1>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <p style="color:red">{{ message }}</p>
    {% endfor %}
  {% endif %}
{% endwith %}
<form method="POST">
    <label>Escolha a sala:</label><br>
    <select name="sala">
        {% for nome, dados in salas.items() %}
        <option value="{{ nome }}">{{ nome }} ({{ dados.jogadores|length }}/49)</option>
        {% endfor %}
    </select><br>
    <input type="text" name="nick" placeholder="Seu nick" required><br>
    <button type="submit">Continuar</button>
</form>
</div>
</body>
</html>
