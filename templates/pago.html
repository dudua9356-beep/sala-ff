<!-- templates/pago.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Recarga Sala FF 🔥</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-image: url("COLE_AQUI_O_LINK_DA_IMAGEM_DE_FUNDO");
        background-size: cover;
        background-position: center;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .container {
        background-color: rgba(0, 0, 0, 0.7);
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        color: #fff;
        width: 90%;
        max-width: 450px;
    }
    h1 {
        margin-bottom: 20px;
    }
    .qr-code {
        margin: 20px 0;
    }
    .pix-code {
        background-color: #fff;
        color: #000;
        padding: 10px;
        border-radius: 8px;
        word-break: break-all;
        margin-bottom: 10px;
    }
    button {
        padding: 10px 20px;
        background-color: #ffcc00;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }
    button:hover {
        background-color: #ffaa00;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Recarga Sala FF 🔥</h1>
    <p>Nick: {{ nick }}</p>

    {% if qr_code %}
    <div class="qr-code">
        <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code">
    </div>
    {% else %}
    <p>QR Code não gerado. Tente novamente.</p>
    {% endif %}

    {% if pix_code %}
    <div class="pix-code" id="pixCode">{{ pix_code }}</div>
    <button onclick="copiarPix()">Copiar código Pix</button>
    {% endif %}
</div>

<script>
function copiarPix() {
    const pix = document.getElementById("pixCode").innerText;
    navigator.clipboard.writeText(pix).then(() => {
        alert("Código Pix copiado!");
    }).catch(() => {
        alert("Não foi possível copiar o código.");
    });
}
</script>
</body>
</html>
