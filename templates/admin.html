<!-- painel.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel ADM</title>
</head>
<body>
<h1>Painel ADM</h1>

<h2>Salas</h2>
<ul>
{% for nome, info in salas.items() %}
    <li>{{ nome }} - {{ info.ocupados }}/{{ info.max }} jogadores</li>
{% endfor %}
</ul>

<h2>Jogadores Pagaram</h2>
<ul>
{% for jogador in jogadores %}
    <li>{{ jogador.nick }} → {{ jogador.sala }}</li>
{% endfor %}
</ul>
</body>
</html>
