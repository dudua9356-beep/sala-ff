<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Recarga Sala FF 🔥</title>
<style>
body {
    background-image: url('https://lh3.googleusercontent.com/d/1vP4_uS_TqXf_I6Q0Q6F1nE2S8E4B9XyL');
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: sans-serif;
}
.container { background: rgba(0,0,0,0.7); padding: 30px; border-radius: 10px; color: #fff; }
select, input { padding: 10px; margin: 10px 0; width: 100%; }
button { padding: 10px; width: 100%; background: orange; border: none; color: #fff; font-weight: bold; cursor: pointer; }
button:hover { opacity: 0.8; }
.adm-btn { position: absolute; top: 10px; right: 10px; }
</style>
</head>
<body>
<a class="adm-btn" href="{{ url_for('adm_login') }}">ADM</a>
<div class="container">
<h1>Recarga Sala FF 🔥</h1>
{% if erro %}<p style="color:red">{{ erro }}</p>{% endif %}
<form method="POST">
    <label>Escolha a sala:</label>
    <select name="sala">
        {% for nome, dados in salas.items() %}
            <option value="{{ nome }}">{{ nome }} ({{ dados.pagos|length }}/49)</option>
        {% endfor %}
    </select>
    <label>Digite seu nick do Free Fire:</label>
    <input type="text" name="nick" placeholder="Seu nick" required>
    <button type="submit">Continuar</button>
</form>
</div>
</body>
</html>
