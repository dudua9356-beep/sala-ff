<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pagamento</title>
</head>
<body>
<h1>Recarga Sala FF 🔥</h1>
<p>Nick: {{ nick }}</p>
<p>Sala: {{ sala }}</p>

{% if qr_code %}
<h2>Escaneie o QR Code para pagar R$6</h2>
<img src="data:image/png;base64,{{ qr_code }}" alt="QR Code"><br>
<p>Código Pix (copia e cola):</p>
<textarea readonly style="width:300px; height:60px;">{{ pix_code }}</textarea>
{% else %}
<p style="color:red">QR Code não gerado. Tente novamente.</p>
{% endif %}

</body>
</html>
