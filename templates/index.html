<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recarga Sala FF 🔥</title>
</head>
<body>
    <h1>Escolha sua Sala</h1>

    {% if erro %}
        <p style="color:red;">{{ erro }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="nick" placeholder="Seu nick do Free Fire">
        <button type="submit">Continuar</button>
    </form>

    <h2>Salas disponíveis:</h2>
    <ul>
    {% for nome, dados in salas.items() %}
        <li>{{ nome }} - ID: {{ dados.id }}, Senha: {{ dados.senha }}</li>
    {% endfor %}
    </ul>
</body>
</html>
