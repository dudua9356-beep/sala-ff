<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Recarga Sala FF 🔥</title>
<style>
body {
    background: url('https://lh3.googleusercontent.com/d/1vP4_uS_TqXf_I6Q0Q6F1nE2S8E4B9XyL') no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
    color: #fff;
    text-align: center;
}
.container { margin-top: 100px; }
select, input { padding: 10px; margin: 10px; font-size: 16px; }
button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
<h1>Recarga Sala FF 🔥</h1>
{% if erro %}<p style="color:red">{{ erro }}</p>{% endif %}
<form method="POST">
<input type="text" name="nick" placeholder="Digite seu nick do Free Fire" required><br>
<select name="sala" required>
<option value="">Escolha a sala</option>
{% for nome, dados in salas.items() %}
<option value="{{ nome }}">{{ nome }} ({{ dados.jogadores|length }}/{{ dados.max }})</option>
{% endfor %}
</select><br>
<button type="submit">Continuar</button>
</form>
<a href="{{ url_for('adm_login') }}" style="position:absolute; top:10px; right:10px; color:#fff;">ADM</a>
</div>
</body>
</html>
