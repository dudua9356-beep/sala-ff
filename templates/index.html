<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin Sala FF</title>
<style>
body { font-family: Arial; background:#1a1a1a; color:#fff; }
input, button { padding:10px; margin:5px; }
button { background: #ff3d00; border:none; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<h1>🎮 Painel Admin Sala FF</h1>

{% if message %}
<p style="color:#0f0">{{ message }}</p>
{% endif %}

<form method="POST">
    ID da Sala: <input type="text" name="sala_id" required><br>
    Senha: <input type="text" name="senha" required><br>
    <button type="submit">Criar Sala</button>
</form>

<h2>Salas Ativas</h2>
<ul>
{% for link, sala in salas.items() %}
<li>Link: <a href="{{ url_for('sala', link=link) }}">{{ url_for('sala', link=link, _external=True) }}</a> | ID: {{ sala.sala_id }} | Senha: {{ sala.senha }}</li>
{% endfor %}
</ul>
</body>
</html>
