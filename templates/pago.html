<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pagamento - {{ sala }}</title>
<style>
body {text-align:center; font-family: Arial, sans-serif; background:#000; color:#fff;}
.container {margin-top:50px;}
button {padding:10px 20px; margin-top:10px;}
input {width: 300px; padding: 5px;}
</style>
<script>
function copiar() {
  var copyText = document.getElementById("codigo_pix");
  copyText.select();
  copyText.setSelectionRange(0, 99999);
  document.execCommand("copy");
  alert("Código copiado!");
  window.location.href = "/confirmar_pagamento?nick={{ nick }}&sala={{ sala }}";
}
</script>
</head>
<body>
<div class="container">
<h1>Nick: {{ nick }}</h1>
{% if qr_code %}
<img src="data:image/png;base64,{{ qr_code }}" alt="QR Code"><br>
<input type="text" id="codigo_pix" value="{{ qr_code_text }}" readonly><br>
<button onclick="copiar()">Copiar e Confirmar Pagamento</button>
{% else %}
<p>QR Code não gerado. Tente novamente.</p>
{% endif %}
</div>
</body>
</html>
