<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Recarga Sala FF 🔥</title>
<style>
body {
    background: url('https://share.google/cG3BrTRr9BBOkoS0n') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: sans-serif;
    color: #fff;
}
.container { background: rgba(0,0,0,0.7); padding: 30px; border-radius: 15px; }
input, select, button { margin: 10px 0; padding: 10px; border-radius: 5px; width: 100%; }
button { cursor: pointer; background-color: orange; color: #fff; border: none; }
.adm { position: absolute; top: 10px; right: 10px; }
</style>
</head>
<body>
<div class="adm"><a href="{{ url_for('admin_login') }}" style="color:white">ADM</a></div>
<div class="container">
<h1>Recarga Sala FF 🔥</h1>
{% if erro %}<p style="color:red">{{ erro }}</p>{% endif %}
<form method="POST">
<label>Escolha a sala:</label>
<select name="sala" required>
{% for nome, dados in salas.items() %}
    <option value="{{ nome }}">{{ nome }} ({{ dados.ocupadas }}/{{ dados.max }})</option>
{% endfor %}
</select>
<label>Digite seu nick do Free Fire:</label>
<input type="text" name="nick" placeholder="Seu nick" required>
<button type="submit">Continuar</button>
</form>
</div>
</body>
</html>
