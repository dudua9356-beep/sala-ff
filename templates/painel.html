<h1>Painel</h1>

<form method="POST">
<input name="nome" placeholder="Nome da sala">
<input name="id" placeholder="ID">
<input name="senha" placeholder="Senha">
<button>Criar Sala</button>
</form>

{% for nome, sala in salas.items() %}
<p>{{ nome }} ({{ sala['ocupados'] }}/{{ sala['max'] }})</p>
{% endfor %}
