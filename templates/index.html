<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recarga Sala FF 🔥</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #fff;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #ffcc00;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }
        .erro {
            color: red;
        }
        .sala-link {
            display: block;
            margin: 10px;
            padding: 15px;
            background-color: #222;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            transition: 0.3s;
        }
        .sala-link:hover {
            background-color: #ffcc00;
            color: #000;
        }
    </style>
</head>
<body>
    <h1>Recarga Sala FF 🔥</h1>

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="nick" placeholder="Digite seu nick do Free Fire">
        <button type="submit">Continuar</button>
    </form>

    <h2>Salas disponíveis</h2>
    {% if salas %}
        {% for nome, dados in salas.items() %}
            <a class="sala-link" href="{{ url_for('sala') }}?nick={{ request.args.get('nick', '') }}">
                {{ nome }}
            </a>
        {% endfor %}
    {% else %}
        <p>Nenhuma sala disponível no momento.</p>
    {% endif %}
</body>
                </html>
