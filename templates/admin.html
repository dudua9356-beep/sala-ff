<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Painel ADM</title></head>
<body>
<h1>Painel ADM - Editar Salas</h1>
{% for nome, dados in salas.items() %}
<form method="POST">
<h2>{{ nome }}</h2>
ID da Sala: <input type="text" name="id_sala" value="{{ dados.id }}"><br>
Senha: <input type="text" name="senha_sala" value="{{ dados.senha }}"><br>
<input type="hidden" name="sala" value="{{ nome }}">
<button type="submit">Atualizar</button>
</form>
<hr>
{% endfor %}

<h2>Jogadores</h2>
<table border="1">
<tr><th>Sala</th><th>Nick</th><th>Pago?</th></tr>
{% for j in jogadores %}
<tr>
<td>{{ j.sala }}</td>
<td>{{ j.nick }}</td>
<td>{{ "Sim" if j.pago else "Não" }}</td>
</tr>
{% endfor %}
</table>
</body>
</html>
