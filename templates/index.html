<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Recarga Sala FF 🔥</title>
<style>
  body {
    background-image: url('https://share.google/cG3BrTRr9BBOkoS0n'); 
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  form { background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; text-align: center; }
  input, select, button { padding: 10px; margin: 10px; width: 200px; }
</style>
</head>
<body>
<form method="POST">
  <h1>Recarga Sala FF 🔥</h1>
  {% if erro %}<p style="color:red">{{ erro }}</p>{% endif %}

  <input type="text" name="nick" placeholder="Seu nick" required>
  <select name="sala" required>
    {% for nome, dados in salas.items() %}
      <option value="{{ nome }}">{{ nome }} ({{ dados.ocupados }}/{{ dados.max }})</option>
    {% endfor %}
  </select>
  <br>
  <button type="submit">Continuar</button>
  <br><br>
  <a href="{{ url_for('adm_login') }}" style="color:yellow;">ADM</a>
</form>
</body>
</html>
