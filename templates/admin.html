<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel ADM</title>
</head>
<body>
<h1>Painel ADM</h1>
<a href="{{ url_for('logout') }}">Sair</a>
{% for nome, dados in salas.items() %}
<h2>{{ nome }}</h2>
<p>Vagas: {{ dados.jogadores|length }}/{{ dados.max_vagas }}</p>
<p>Jogadores:</p>
<ul>
{% for j in dados.jogadores %}
  <li>{{ j }}</li>
{% endfor %}
</ul>
{% endfor %}
</body>
</html>
