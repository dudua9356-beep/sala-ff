<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recarga Sala FF 🔥</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            text-align: center;
            padding: 50px;
        }
        input, select, button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }
        button {
            background-color: #ff6600;
            border: none;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff3300;
        }
        .erro { color: #ff3333; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>Recarga Sala FF 🔥</h1>

    {% if erro %}
        <div class="erro">{{ erro }}</div>
    {% endif %}

    <form method="POST">
        <label for="sala">Escolha a sala:</label>
        <select name="sala" id="sala" required>
            {% for nome, dados in salas.items() %}
                <option value="{{ nome }}">{{ nome }} ({{ dados.ocupados }}/{{ dados.max }})</option>
            {% endfor %}
        </select>
        <br>

        <label for="nick">Digite seu nick do Free Fire:</label>
        <input type="text" name="nick" id="nick" placeholder="Seu nick" required>
        <br>

        <button type="submit">Continuar</button>
    </form>
</body>
            </html>
