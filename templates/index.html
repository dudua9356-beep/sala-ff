<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Recarga Sala FF 🔥</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-image: url('https://lh3.googleusercontent.com/d/1vP4_uS_TqXf_I6Q0Q6F1nE2S8E4B9XyL');
    background-size: cover;
    background-position: center;
    font-family: Arial, sans-serif;
    color: white;
  }
  .container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: rgba(0,0,0,0.4);
  }
  input, select, button {
    padding: 10px;
    margin: 10px 0;
    font-size: 16px;
  }
  button { cursor: pointer; }
</style>
</head>
<body>
  <div class="container">
    <h1>Recarga Sala FF 🔥</h1>
    {% if erro %}<p style="color:red">{{ erro }}</p>{% endif %}
    <form method="POST">
      <input type="text" name="nick" placeholder="Seu nick do Free Fire" required>
      <select name="sala" required>
        <option value="">Escolha a sala</option>
        {% for nome, dados in salas.items() %}
        <option value="{{ nome }}">{{ nome }} ({{ dados.jogadores|length }}/49)</option>
        {% endfor %}
      </select>
      <button type="submit">Continuar</button>
    </form>
  </div>
</body>
</html>
