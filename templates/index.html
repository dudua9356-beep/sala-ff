<!DOCTYPE html>
<html>
<head>
    <title>Sala FF</title>
</head>
<body style="background:black;color:white;text-align:center;font-family:sans-serif;">

<h1>Inscrição Sala FF</h1>

<input type="text" id="nick" placeholder="Digite seu nick">
<button onclick="pagar()">Pagar R$6</button>

<div id="resultado"></div>

<script>
async function pagar() {
    const nick = document.getElementById("nick").value;

    const res = await fetch("/criar_pagamento", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({nick})
    });

    const data = await res.json();

    document.getElementById("resultado").innerHTML =
        "<p>Escaneie o QR Code:</p>" +
        "<img width='200' src='data:image/png;base64," + data.qr_code + "'>";
}
</script>

</body>
</html>
