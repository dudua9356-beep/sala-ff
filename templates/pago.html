<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pagamento</title>

<script>
setInterval(() => {
fetch(`/${{cliente}}/status?nick={{nick}}&sala={{sala}}`)
.then(res => res.json())
.then(data => {
if (data.pago) {
window.location.href = `/${{cliente}}/sala?nick={{nick}}&sala={{sala}}`
}
})
}, 3000);
</script>

</head>

<body>

<h2>Pague para entrar</h2>

<img src="data:image/png;base64,{{ qr_code }}"><br>

<input value="{{ qr_code_text }}" readonly>

</body>
</html>
