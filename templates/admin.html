<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel ADM</title>
</head>
<body>
<h1>Painel ADM</h1>

<h2>Editar Salas</h2>
{% for nome, dados in salas.items() %}
<form method="POST" action="{{ url_for('editar_sala') }}">
    <b>{{ nome }}</b><br>
    ID da Sala: <input type="text" name="id" value="{{ dados.id }}" required><br>
    Senha: <input type="text" name="senha" value="{{ dados.senha }}" required><br>
    <input type="hidden" name="sala" value="{{ nome }}">
    <button type="submit">Atualizar</button>
</form>
<hr>
{% endfor %}

<h2>Jogadores</h2>
<form method="POST" action="{{ url_for('limpar_jogadores') }}">
    <button type="submit">Limpar Lista de Jogadores</button>
</form>
<table border="1" cellpadding="5">
    <tr>
        <th>Sala</th>
        <th>Nick</th>
        <th>Pago?</th>
    </tr>
    {% for j in jogadores %}
    <tr>
        <td>{{ j.sala }}</td>
        <td>{{ j.nick }}</td>
        <td>{{ 'Sim' if j.pago else 'Não' }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
