<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Recarga Sala FF 🔥</title>
</head>
<body>
<h1>Recarga Sala FF 🔥</h1>

{% if erro %}
<p style="color:red">{{ erro }}</p>
{% endif %}

<form method="POST">
<label>Escolha a sala:</label>
<select name="sala">
{% for nome, dados in salas.items() %}
  <option value="{{ nome }}">{{ nome }} ({{ dados.jogadores|length }}/{{ dados.max_vagas }})</option>
{% endfor %}
</select><br><br>

<label>Digite seu nick do Free Fire:</label>
<input type="text" name="nick" placeholder="Seu nick"><br><br>
<button type="submit">Continuar</button>
</form>

<a href="{{ url_for('adm_login') }}" style="position:absolute; top:10px; right:10px;">ADM</a>

</body>
</html>
