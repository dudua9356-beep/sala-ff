<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pagamento - {{ sala }}</title>
<style>
body {
    background: url('https://share.google/K03P5KyhpFTigjOaq') no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
}
.container {
    margin-top: 50px;
    padding: 20px;
    background: rgba(0,0,0,0.6);
    display: inline-block;
    border-radius: 10px;
}
button { padding: 10px 20px; margin: 10px; cursor: pointer; }
input { padding: 10px; width: 250px; }
</style>
<script>
function copiar() {
    var copyText = document.getElementById("pix_code");
    copyText.select();
    copyText.setSelectionRange(0, 99999);
    document.execCommand("copy");
    alert("Código Pix copiado!");
}
</script>
</head>
<body>
<div class="container">
<h2>Nick: {{ nick }}</h2>
<p>Escaneie o QR Code abaixo para pagar R$6 e liberar a sala:</p>
{% if qr_code %}
<img src="data:image/png;base64,{{ qr_code }}" alt="QR Code"><br>
<input type="text" value="{{ pix_code }}" id="pix_code" readonly>
<button onclick="copiar()">Copiar</button>
{% else %}
<p>QR Code não gerado. Tente novamente.</p>
{% endif %}
</div>
</body>
</html>
