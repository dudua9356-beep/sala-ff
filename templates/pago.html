<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pagamento Sala FF 🔥</title>
</head>
<body>
    <h1>Pagamento para {{ nick }}</h1>
    <p>Valor: R$6,00 via PIX</p>

    {% if qr_code %}
        <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code do pagamento">
    {% else %}
        <p>Erro ao gerar QR Code. Tente novamente.</p>
    {% endif %}
</body>
</html>
