<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recarga Sala FF 🔥</title>

<style>
body {<a style="position:fixed;top:10px;right:10px;color:white" href="/login">ADM</a>
    margin: 0;
    padding: 0;
    background: black;
    font-family: Arial;
    color: white;
}

.container {
    max-width: 400px;
    margin: 80px auto;
    background: rgba(0,0,0,0.7);
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

input, select, button {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
}

button {
    background: yellow;
    cursor: pointer;
}

/* 🔥 BOTÃO ADM */
#adm-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    color: white;
    font-weight: bold;
    z-index: 1000;
    text-decoration: none;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 6px;
}
</style>

</head>
<body>

<!-- 🔥 BOTÃO ADM -->
<a id="adm-btn" href="/login">ADM</a>

<div class="container">
<h1>Recarga Sala FF 🔥</h1>

{% if erro %}
<p style="color:red">{{ erro }}</p>
{% endif %}

<form method="POST">
<input type="text" name="nick" placeholder="Seu nick" required>

<select name="sala" required>
<option disabled selected>Escolha a sala</option>
{% for nome, dados in salas.items() %}
<option value="{{ nome }}">{{ nome }} ({{ dados['ocupados'] }}/{{ dados['max'] }})</option>
{% endfor %}
</select>

<button type="submit">Continuar</button>
</form>

</div>

</body>
</html>
