<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pagamento</title>
<style>
body { text-align: center; font-family: sans-serif; background: #111; color: #fff; }
.qr { margin: 20px; }
button { padding: 10px 20px; margin: 10px; border:none; background: orange; color: #fff; cursor:pointer; border-radius:5px;}
input { width: 300px; text-align: center; }
</style>
</head>
<body>
<h1>Recarga Sala FF 🔥</h1>
<p>Nick: {{ nick }}</p>
<p>Sala: {{ sala }}</p>
{% if erro %}<p style="color:red">{{ erro }}</p>{% else %}
<img class="qr" src="data:image/png;base64,{{ qr_code }}" alt="QR Code"><br>
<input type="text" id="codigo_pix" value="{{ codigo_pix }}" readonly>
<button onclick="copiar()">Copiar Código</button>
<script>
function copiar() {
  var copyText = document.getElementById("codigo_pix");
  copyText.select();
  copyText.setSelectionRange(0, 99999);
  document.execCommand("copy");
  alert("Código copiado!");
}
</script>
<a href="{{ url_for('sala', nick=nick) }}"><button>Paguei</button></a>
{% endif %}
</body>
</html>
